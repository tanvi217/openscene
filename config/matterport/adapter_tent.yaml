# Run 3 (optional): supervised + vanilla entropy minimization on all unlabeled points (TENT-style).
# Tests whether the confidence mask matters vs H2 (adapter_with_entropy.yaml).
#
# Loss: J = L_sup + lambda2 * mean(H) over unlabeled points (no masking).
#
# Usage:
#   cd ~/repopt-3d/third_party/openscene
#   PYTHONPATH=. python run/train_adapter.py --config config/matterport/adapter_tent.yaml

DATA:
  data_root: /work/pi_adamoneill_umass_edu/tanviagarwal_umass_edu/openscene/matterport_3d
  data_root_2d_fused_feature: /work/pi_dagarwal_umass_edu/project_23/soorya/openscene/data/matterport_multiview_openseg_test
  feature_2d_extractor: openseg
  classes: 21
  voxel_size: 0.02
  input_color: False
  use_shm: False

ADAPTER:
  feat_dim: 768
  ignore_label: 255
  train_gpu: [0]
  workers: 4
  base_lr: 0.0001
  weight_decay: 0.0001
  epochs: 50
  start_epoch: 0
  manual_seed: 42
  print_freq: 20
  save_freq: 10
  save_path: /work/pi_adamoneill_umass_edu/tanviagarwal_umass_edu/openscene/experiments/adapter_tent
  resume:
  aug: False
  loop: 1
  labeled_indices_dir: /work/pi_adamoneill_umass_edu/tanviagarwal_umass_edu/openscene/matterport_labeled_indices/train
  lambda2: 0.1
  entropy_tau: 1.52
  entropy_unmasked: True

TEST:
  split: test
  test_workers: 4
  test_gpu: [0]
  test_batch_size: 1
  model_path:
  save_folder: /work/pi_adamoneill_umass_edu/tanviagarwal_umass_edu/openscene/experiments/adapter_tent/eval
  confidence_dir: /work/pi_adamoneill_umass_edu/tanviagarwal_umass_edu/openscene/matterport_baseline_confidence/test
  do_h2_diagnostic: True

Distributed:
  dist_url: tcp://127.0.0.1:6789
  dist_backend: 'nccl'
  multiprocessing_distributed: False
  world_size: 1
  rank: 0
