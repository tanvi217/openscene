# =============================================================================
# Combined H1 + H2 + H3 + spatial + supervised (20 epochs):
#   J = L_sup
#       + lambda_h1 * L_ent_H1     (vanilla mean entropy on all unlabeled, TENT-style)
#       + lambda2 * L_ent_H2       (confidence-masked, H < tau)
#       + lambda2_inverted * L_ent_H3   (inverted mask, H > tau)
#       + lambda_spatial * L_spatial    (6-neighbor softmax smoothness)
#
# entropy_mode: combined_h1_h2_h3_spatial (alias: combined_h2_h3_spatial with lambda_h1=0)
# All entropy weights share entropy_warmup_epochs ramp. H2/H3 need entropy_tau.
#
# Train:  PYTHONPATH=. python run/train_adapter.py --config config/matterport/adapter_combined_h2_h3_spatial.yaml
#   or:   bash scripts/run_adapter_combined_regularizers.sh
# Eval:   PYTHONPATH=. python run/evaluate_adapter.py --config config/matterport/adapter_combined_h2_h3_spatial.yaml
#
# Symlinks:  bash scripts/setup_matterport_adapter_symlinks.sh
# =============================================================================

DATA:
  data_root: data_matterport_adapter/matterport_3d
  data_root_2d_fused_feature: data/matterport_multiview_openseg_test
  feature_2d_extractor: openseg
  classes: 21
  voxel_size: 0.02
  input_color: False
  use_shm: False

ADAPTER:
  feat_dim: 768
  ignore_label: 255
  train_gpu: [0]
  workers: 4
  base_lr: 0.0001
  weight_decay: 0.0001
  epochs: 20
  start_epoch: 0
  manual_seed: 42
  print_freq: 20
  save_freq: 5
  save_path: exp/adapter_combined_h2_h3_spatial
  resume:
  aug: False
  loop: 1
  labeled_indices_dir: data/matterport_labeled_indices/train
  labeled_frac: 0.05
  entropy_mode: combined_h1_h2_h3_spatial
  entropy_tau: 1.52
  entropy_unmasked: False
  entropy_warmup_epochs: 5
  lambda_h1: 0.05
  lambda2: 0.1
  lambda2_inverted: 0.05
  lambda_spatial: 0.02
  spatial_warmup_epochs: 5
  spatial_smooth_unlabeled_only: True
  spatial_max_edges: 0

TEST:
  split: test
  test_workers: 4
  test_gpu: [0]
  test_batch_size: 1
  model_path: exp/adapter_combined_h2_h3_spatial/model/model_best.pth.tar
  save_folder: exp/adapter_combined_h2_h3_spatial/eval
  confidence_dir: data/matterport_baseline_confidence/test
  do_h2_diagnostic: True

Distributed:
  dist_url: tcp://127.0.0.1:6789
  dist_backend: 'nccl'
  multiprocessing_distributed: False
  world_size: 1
  rank: 0
