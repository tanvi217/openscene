# =============================================================================
# Supervised-only adapter (ablation):  J = L_sup
#   Frozen OpenSeg features → residual MLP + linear head; CE on 5% labeled points.
# Full guide: README_ADAPTER.md
#
# Train:  PYTHONPATH=. python run/train_adapter.py --config config/matterport/adapter_sup_only.yaml
# Eval:    PYTHONPATH=. python run/evaluate_adapter.py --config config/matterport/adapter_sup_only.yaml
#
# Override paths (cluster): append space-separated key value pairs, e.g.
#   data_root /work/.../matterport_3d  save_path /work/.../exp/adapter_sup_only
# =============================================================================

DATA:
  # Parent of train/ and test/ containing *.pth scenes
  data_root: data/matterport_3d
  # Fused OpenSeg .pt features (must cover train + test scenes)
  data_root_2d_fused_feature: data/matterport_multiview_openseg_test
  feature_2d_extractor: openseg
  classes: 21
  voxel_size: 0.02
  input_color: False
  use_shm: False

ADAPTER:
  feat_dim: 768
  ignore_label: 255
  train_gpu: [0]
  workers: 4
  base_lr: 0.0001
  weight_decay: 0.0001
  epochs: 50
  start_epoch: 0
  manual_seed: 42
  print_freq: 20
  save_freq: 10
  save_path: exp/adapter_sup_only
  resume:
  aug: False
  loop: 1
  # From scripts/prepare_labeled_split.py (one .npy per train scene)
  labeled_indices_dir: data/matterport_labeled_indices/train
  labeled_frac: 0.05
  # Entropy branch disabled
  lambda2: 0.0
  entropy_tau:
  entropy_unmasked: False
  entropy_mode: hard_mask
  entropy_warmup_epochs: 0

TEST:
  split: test
  test_workers: 4
  test_gpu: [0]
  test_batch_size: 1
  # Default eval checkpoint (exists after train saves model_best)
  model_path: exp/adapter_sup_only/model/model_best.pth.tar
  save_folder: exp/adapter_sup_only/eval
  # Per-scene Run-0 fusion confidence .npy (see eval_fusion_baseline.yaml)
  confidence_dir: data/matterport_baseline_confidence/test
  do_h2_diagnostic: True

Distributed:
  dist_url: tcp://127.0.0.1:6789
  dist_backend: 'nccl'
  multiprocessing_distributed: False
  world_size: 1
  rank: 0
