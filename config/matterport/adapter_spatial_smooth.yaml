# =============================================================================
# H2 + spatial smoothness on 6-neighbor voxel edges:
#   J = L_sup + lambda2 * L_ent + lambda_spatial * L_spatial
# L_spatial = mean ( ||softmax(z_i) - softmax(z_j)||^2 ) over visible +x/+y/+z edges;
# by default only edges between two unlabeled visible voxels (spatial_smooth_unlabeled_only).
# README: README_ADAPTER.md
#
# Train: PYTHONPATH=. python run/train_adapter.py --config config/matterport/adapter_spatial_smooth.yaml
# =============================================================================

DATA:
  data_root: data/matterport_3d
  data_root_2d_fused_feature: data/matterport_multiview_openseg_test
  feature_2d_extractor: openseg
  classes: 21
  voxel_size: 0.02
  input_color: False
  use_shm: False

ADAPTER:
  feat_dim: 768
  ignore_label: 255
  train_gpu: [0]
  workers: 4
  base_lr: 0.0001
  weight_decay: 0.0001
  epochs: 50
  start_epoch: 0
  manual_seed: 42
  print_freq: 20
  save_freq: 10
  save_path: exp/adapter_spatial_smooth
  resume:
  aug: False
  loop: 1
  labeled_indices_dir: data/matterport_labeled_indices/train
  labeled_frac: 0.05
  lambda2: 0.1
  entropy_tau: 1.52
  entropy_unmasked: False
  entropy_mode: hard_mask
  entropy_warmup_epochs: 5
  lambda_spatial: 0.02
  spatial_warmup_epochs: 5
  spatial_smooth_unlabeled_only: True
  spatial_max_edges: 0

TEST:
  split: test
  test_workers: 4
  test_gpu: [0]
  test_batch_size: 1
  model_path: exp/adapter_spatial_smooth/model/model_best.pth.tar
  save_folder: exp/adapter_spatial_smooth/eval
  confidence_dir: data/matterport_baseline_confidence/test
  do_h2_diagnostic: True

Distributed:
  dist_url: tcp://127.0.0.1:6789
  dist_backend: 'nccl'
  multiprocessing_distributed: False
  world_size: 1
  rank: 0
